<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>约 - 个人主页</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0a0a0c',
                        cardbg: '#141418',
                        cardhover: '#1c1c24',
                        accent: '#3b82f6',
                        accenthover: '#2563eb'
                    }
                }
            }
        }
    </script>
    <!-- Font Inter & PingFang SC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0a0a0c;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        /* Glassmorphism background blur circles */
        .glow-orb {
            position: absolute;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative px-4 py-12">

    <!-- Background Ambient Glow Orbs -->
    <div class="glow-orb w-96 h-96 bg-blue-600 rounded-full top-10 left-1/4"></div>
    <div class="glow-orb w-96 h-96 bg-indigo-500 rounded-full bottom-10 right-1/4"></div>

    <!-- Main Container -->
    <main class="w-full max-w-md relative z-10">
        <div class="bg-cardbg/80 backdrop-blur-xl border border-white/10 rounded-3xl p-8 shadow-2xl transition-all duration-300 hover:border-white/20">
            
            <!-- Avatar Section -->
            <div class="flex flex-col items-center text-center">
                <div class="relative group mb-6">
                    <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-full blur opacity-70 group-hover:opacity-100 transition duration-500"></div>
                    <div class="relative w-24 h-24 rounded-full bg-[#1e1e24] border-2 border-white/10 flex items-center justify-center text-3xl font-bold text-white shadow-inner">
                        约
                    </div>
                </div>

                <!-- Name & Bio -->
                <h1 class="text-2xl font-bold tracking-tight text-white mb-2">约</h1>
                <p class="text-sm font-medium text-neutral-400 max-w-xs leading-relaxed mb-8">
                    一个默默无闻的财产搬运工。
                </p>
            </div>

            <!-- Contact & Social Links -->
            <div class="space-y-3">
                <!-- QQ Link (with copy feature) -->
                <button onclick="copyQQ()" class="w-full group flex items-center justify-between p-4 rounded-2xl bg-white/[0.03] hover:bg-white/[0.07] border border-white/5 hover:border-white/10 transition-all duration-300 text-left">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-10 h-10 rounded-xl bg-blue-500/10 flex items-center justify-center text-blue-400 group-hover:scale-105 transition-transform duration-300">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.84 3.44 8.87 8 9.76V15H8v-3h2V9.5C10 7.57 11.35 6 13.5 6c1.03 0 1.91.08 2.17.11v2.5h-1.49c-1.08 0-1.29.51-1.29 1.26V12h3l-.4 3h-2.6v6.8f10 5.16 10-10C22 6.48 17.52 2 12 2z"/></svg>
                        </div>
                        <div>
                            <div class="text-xs text-neutral-400 font-medium">QQ 交流</div>
                            <div class="text-sm font-semibold text-white tracking-wide">2622713235</div>
                        </div>
                    </div>
                    <span id="copy-tip" class="text-xs text-neutral-400 group-hover:text-blue-400 transition-colors">点击复制</span>
                </button>

                <!-- Email Link -->
                <a href="mailto:2622713235@qq.com" class="w-full group flex items-center justify-between p-4 rounded-2xl bg-white/[0.03] hover:bg-white/[0.07] border border-white/5 hover:border-white/10 transition-all duration-300 text-left">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-10 h-10 rounded-xl bg-indigo-500/10 flex items-center justify-center text-indigo-400 group-hover:scale-105 transition-transform duration-300">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        </div>
                        <div>
                            <div class="text-xs text-neutral-400 font-medium">电子邮箱</div>
                            <div class="text-sm font-semibold text-white tracking-wide">2622713235@qq.com</div>
                        </div>
                    </div>
                    <span class="text-xs text-neutral-400 group-hover:text-indigo-400 transition-colors">发送邮件</span>
                </a>
            </div>

            <!-- Footer Info -->
            <div class="mt-8 pt-6 border-t border-white/5 text-center space-y-2">
                <p class="text-xs text-neutral-500">如有侵权请联系 QQ：2622713235</p>
                <p class="text-xs text-neutral-600">&copy; 2026 约. All rights reserved.</p>
            </div>
        </div>
    </main>

    <!-- Toast Notification for Copy -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-neutral-900 border border-white/10 text-white text-xs px-4 py-2.5 rounded-full shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-50 flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span id="toast-msg">已复制 QQ 号到剪贴板</span>
    </div>

    <!-- JavaScript Interactions -->
    <script>
        function copyQQ() {
            const qqText = "2622713235";
            const textarea = document.createElement("textarea");
            textarea.value = qqText;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast("已成功复制 QQ 号：2622713235");
                const tip = document.getElementById("copy-tip");
                tip.textContent = "已复制";
                tip.classList.add("text-emerald-400");
                setTimeout(() => {
                    tip.textContent = "点击复制";
                    tip.classList.remove("text-emerald-400");
                }, 2000);
            } catch (err) {
                showToast("复制失败，请手动复制");
            }
            document.body.removeChild(textarea);
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            const msg = document.getElementById("toast-msg");
            msg.textContent = message;
            toast.classList.remove("opacity-0", "pointer-events-none");
            toast.classList.add("opacity-100");
            setTimeout(() => {
                toast.classList.remove("opacity-100");
                toast.classList.add("opacity-0", "pointer-events-none");
            }, 2500);
        }
    </script>
</body>
</html>
