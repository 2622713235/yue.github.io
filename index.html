<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>约 | 个人主页</title>
    <style>
        :root {
            --bg-color: #050510;
            --primary-color: #00f3ff; /* 霓虹青 */
            --secondary-color: #bc13fe; /* 霓虹紫 */
            --text-color: #e0e0e0;
            --card-bg: rgba(20, 20, 35, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 动态背景 Canvas */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* 主容器 */
        .container {
            width: 90%;
            max-width: 800px;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* 个人资料卡片 */
        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        }

        /* 顶部装饰条 */
        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--secondary-color), var(--primary-color));
        }

        /* 头像区域 */
        .avatar-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
            position: relative;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a2a40, #1a1a2e);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 15px var(--primary-color);
            position: relative;
            z-index: 2;
        }

        /* 头像周围的旋转环 */
        .avatar-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 2px dashed var(--secondary-color);
            animation: spin 10s linear infinite;
            z-index: 1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 名字样式 */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        /* 标语/描述 */
        .tagline {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-bottom: 2rem;
            font-weight: 400;
            letter-spacing: 1px;
            font-family: 'Courier New', Courier, monospace; /* 代码字体风格 */
        }

        /* 联系方式列表 */
        .contact-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }

        .contact-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-color);
        }

        .contact-item:hover {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .icon {
            width: 20px;
            height: 20px;
            fill: var(--primary-color);
        }

        /* 底部版权/侵权提示 */
        .footer-note {
            margin-top: 3rem;
            font-size: 0.8rem;
            color: #888;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
            line-height: 1.6;
        }

        /* 简单的打字机光标效果 */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2rem;
            background-color: var(--primary-color);
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .profile-card {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- 背景画布 -->
    <canvas id="canvas-bg"></canvas>

    <div class="container">
        <div class="profile-card">
            <div class="avatar-container">
                <div class="avatar-ring"></div>
                <div class="avatar">约</div>
            </div>
            
            <h1>约</h1>
            <p class="tagline">> 探索数字边界<span class="cursor"></span></p>

            <div class="contact-list">
                <!-- QQ -->
                <a href="tencent://message/?uin=2622713235&site=&menu=yes" class="contact-item">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <span>QQ: 2622713235</span>
                </a>

                <!-- Email -->
                <a href="mailto:2622713235@qq.com" class="contact-item">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                    <span>Email: 2622713235@qq.com</span>
                </a>
            </div>

            <div class="footer-note">
                所有内容均搜集自网络公开平台，仅作分享与交流使用，版权归原作者所有
            </div>
        </div>
    </div>

    <script>
        // 动态粒子背景脚本
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');

        let particlesArray;

        // 设置 Canvas 尺寸
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 处理窗口大小调整
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });

        // 粒子类
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.directionX = (Math.random() * 0.4) - 0.2; // 缓慢移动
                this.directionY = (Math.random() * 0.4) - 0.2;
                this.size = Math.random() * 2 + 1;
                this.color = '#00f3ff';
            }

            // 绘制粒子
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = 0.5; // 透明度
                ctx.fill();
            }

            // 更新位置
            update() {
                if (this.x > canvas.width || this.x < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y > canvas.height || this.y < 0) {
                    this.directionY = -this.directionY;
                }

                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        // 初始化粒子
        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 9000; // 根据屏幕面积决定粒子数量
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        // 连接粒子的线条
        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                                 + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    
                    if (distance < (canvas.width/7) * (canvas.height/7)) {
                        opacityValue = 1 - (distance/20000);
                        ctx.strokeStyle = 'rgba(0, 243, 255,' + opacityValue * 0.2 + ')'; // 青色连线
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
        }

        init();
        animate();
    </script>
</body>
</html>
